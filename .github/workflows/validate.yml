name: Validate

permissions: {}

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  validate:
    name: Validate
    uses: grafana/xk6/.github/workflows/extension-validate.yml@v1.4.14
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      go-version: "1.27.x"
      go-versions: '["1.27.x"]'
      golangci-lint-version: "v2.13.2"
      platforms: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      k6-versions: '["v2.3.0"]'
      xk6-version: "1.4.14"
